[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "texkit-studio"
dynamic = ["version"]
description = "An open-source LaTeX writing studio in your browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "TexKit Studio contributors" }]
keywords = ["latex", "tex", "editor", "writing", "tectonic", "pdf", "overleaf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Editors",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "platformdirs>=4.0",
  "watchfiles>=0.21",
  "send2trash>=1.8",
  "python-multipart>=0.0.9",
  "pypandoc-binary>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
texkit = "texkit_studio.cli:main"

[tool.hatch.version]
path = "src/texkit_studio/_meta.py"

[tool.hatch.build.targets.wheel]
packages = ["src/texkit_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
