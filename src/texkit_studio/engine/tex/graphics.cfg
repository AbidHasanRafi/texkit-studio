% graphics.cfg for TexKit Studio.
%
% This is the stock TeX Live driver selection (public domain, CC0) plus one addition. Tectonic
% is XeTeX-based and cannot embed .eps files, which journal templates (MDPI, for example) use
% for logos. pdfLaTeX, Overleaf and Prism convert them on the fly with epstopdf; here, when
% \includegraphics meets "name.eps" and "name-eps-converted-to.pdf" exists (yours, or one TexKit
% made for it), that PDF is included instead.
\ProvidesFile{graphics.cfg}%
  [2016/06/04 v1.11 sample graphics configuration, with TexKit EPS support]%

% Select an appropriate default driver
\begingroup
  \chardef\x=0\relax
  % check luatex
  \ifx\luatexversion\@undefined
  % check pdfTeX
  \@ifundefined{pdfoutput}{}{%
    \ifnum\pdfoutput<1 %
    \else
      \chardef\x=1\relax
    \fi
  }%
  % check VTeX
  \@ifundefined{OpMode}{}{%
    \chardef\x=2\relax
  }%
  % check XeTeX
  \@ifundefined{XeTeXversion}{}{%
    \chardef\x=3\relax
  }%
  \else
    \ifnum\luatexversion>85
      \ifnum\outputmode>0
      \chardef\x=4\relax
      \fi
    \else
      \ifnum\pdfoutput>0
      \chardef\x=1\relax
      \fi
    \fi
  \fi
\expandafter\endgroup
\ifcase\x
  % default case
  \def\Gin@driver{dvips.def}%
  \ExecuteOptions{dvips}%
\or
  % pdfTeX is running in pdf mode
  \def\Gin@driver{pdftex.def}%
  \ExecuteOptions{pdftex}%
\or
  % VTeX is running
  \def\Gin@driver{vtex.def}%
  \ExecuteOptions{vtex}%
\or
  % XeTeX is running
  \def\Gin@driver{xetex.def}%
  \ExecuteOptions{xetex}%
  \AtBeginDocument{\texkit@epshook}%
\or
  % luatex (> 0.85)
  \def\Gin@driver{luatex.def}%
  \ExecuteOptions{luatex}%
\else
  \PackageError{graphics}{Unexpected configuration}{}
\fi

% Wrap \Gin@setfile (the step that has found a file and chosen how to include it).
\def\texkit@epshook{%
  \let\texkit@setfile\Gin@setfile
  \def\Gin@setfile##1##2##3{\texkit@try{##1}{##2}{##3}}%
}
\def\texkit@try#1#2#3{%
  \def\texkit@a{eps}\def\texkit@b{#1}%
  \edef\texkit@c{\Gin@ext}%
  \ifx\texkit@a\texkit@b
    \edef\texkit@a{\detokenize{.eps}}\ifx\texkit@a\texkit@c \texkit@epscheck{#1}{#2}{#3}\else
    \edef\texkit@a{\detokenize{.EPS}}\ifx\texkit@a\texkit@c \texkit@epscheck{#1}{#2}{#3}\else
      \texkit@setfile{#1}{#2}{#3}%
    \fi\fi
  \else
    \texkit@setfile{#1}{#2}{#3}%
  \fi
}
\def\texkit@epscheck#1#2#3{%
  \IfFileExists{\Gin@base-eps-converted-to.pdf}%
    {\edef\Gin@base{\Gin@base-eps-converted-to}%
     \def\Gin@ext{.pdf}%
     \texkit@setfile{pdf}{.pdf}{\Gin@base\Gin@ext}}%
    {\texkit@setfile{#1}{#2}{#3}}%
}
\endinput
